[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "benchmark-hatchet-adapter"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "benchmark-experiment-domain",
    "benchmark-optimizer-sdk",
    "hatchet-sdk==1.37.0",
]

[tool.uv.sources]
benchmark-experiment-domain = { workspace = true }
benchmark-optimizer-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark_adapters"]
