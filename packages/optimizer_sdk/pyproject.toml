[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "benchmark-optimizer-sdk"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "grpcio>=1.76.0,<2",
    "protobuf>=6.31.1,<7",
    "pydantic==2.11.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/optimizer_sdk"]
