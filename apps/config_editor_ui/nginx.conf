# Обслуживание собранного SPA во внутреннем контуре.
# Внешние сети не используются: все ассеты лежат в образе.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip              on;
    gzip_types        text/css application/javascript application/json;
    gzip_min_length   1024;

    # Хешированные ассеты можно кешировать надолго.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Настройки контура правятся без пересборки образа — не кешируем.
    location = /runtime-config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA: любой путь отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
