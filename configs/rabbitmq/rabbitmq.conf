# Load definitions on startup (users/vhost/permissions/policies).
management.load_definitions = /etc/rabbitmq/definitions.json

# Keep default loopback-only access for guest user.
loopback_users.guest = true

# Protect broker from OOM on long benchmark runs:
#  - apply backpressure when VM memory reaches 40%,
#  - stop accepting publishers when free disk is too low.
vm_memory_high_watermark.relative = 0.4
disk_free_limit.absolute = 2GB

# Long-running Celery tasks can keep messages unacked for a long time.
# Set a very large timeout (in milliseconds) to avoid channel closure.
# 6 hours = 21_600_000 ms.
consumer_timeout = 21600000
