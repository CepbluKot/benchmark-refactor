name: db-benchmark
services:
  postgres:
    image: postgres:15-alpine
    pull_policy: never
    environment:
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: ${CONTROL_DB_PASSWORD:?set CONTROL_DB_PASSWORD in .env}
      POSTGRES_DB: benchmark_control
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d benchmark_control"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [control]

  control-api:
    image: benchmark-studio-control:local
    pull_policy: never
    environment:
      CONTROL_DATABASE_URL: postgresql://benchmark:${CONTROL_DB_PASSWORD:?set CONTROL_DB_PASSWORD in .env}@postgres:5432/benchmark_control
      CORS_ALLOWED_ORIGINS: ${UI_ORIGIN:?set UI_ORIGIN in .env}
      CLICKHOUSE_SOURCE_HOST: ${CLICKHOUSE_SOURCE_HOST:?set CLICKHOUSE_SOURCE_HOST in .env}
      CLICKHOUSE_SOURCE_PORT: ${CLICKHOUSE_SOURCE_PORT:-8123}
      CLICKHOUSE_SOURCE_USER: ${CLICKHOUSE_SOURCE_USER:?set CLICKHOUSE_SOURCE_USER in .env}
      CLICKHOUSE_SOURCE_PASSWORD: ${CLICKHOUSE_SOURCE_PASSWORD:?set CLICKHOUSE_SOURCE_PASSWORD in .env}
      CLICKHOUSE_SANDBOX_HOST: ${CLICKHOUSE_SANDBOX_HOST:?set CLICKHOUSE_SANDBOX_HOST in .env}
      CLICKHOUSE_SANDBOX_PORT: ${CLICKHOUSE_SANDBOX_PORT:-8123}
      CLICKHOUSE_SANDBOX_USER: ${CLICKHOUSE_SANDBOX_USER:?set CLICKHOUSE_SANDBOX_USER in .env}
      CLICKHOUSE_SANDBOX_PASSWORD: ${CLICKHOUSE_SANDBOX_PASSWORD:?set CLICKHOUSE_SANDBOX_PASSWORD in .env}
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["${API_PORT:-18900}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [control, ingress]

  ui:
    image: benchmark-studio-ui:local
    pull_policy: never
    depends_on:
      control-api: {condition: service_healthy}
    ports: ["${UI_PORT:-18901}:8080"]
    volumes: [./runtime-config.js:/usr/share/nginx/html/runtime-config.js:ro]
    networks: [ingress]

networks:
  control: {internal: true}
  ingress: {}

volumes:
  postgres-data: {}
